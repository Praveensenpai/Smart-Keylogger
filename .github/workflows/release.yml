name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      # ubuntu-latest ships the Android SDK preinstalled. Do not use
      # android-actions/setup-android: it runs `sdkmanager tools`, a package
      # that no longer exists, and the job dies before Gradle starts.
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-35" "build-tools;35.0.0"
          fi
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Build debug APK
        run: |
          cd AndroidKeylogger
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename artifact
        run: |
          cd AndroidKeylogger
          VERSION=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          SRC=app/build/outputs/apk/debug/app-debug.apk
          DEST="smart-keylogger-${VERSION}.apk"
          cp "$SRC" "$DEST"
          echo "ARTIFACT=AndroidKeylogger/$DEST" >> "$GITHUB_ENV"
          sha256sum "$DEST"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-keylogger-apk
          path: ${{ env.ARTIFACT }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARTIFACT }}
          generate_release_notes: true
